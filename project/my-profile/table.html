<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table</title>
</head>
<body>
    <table border="1">
        <tr>
            <td>วาดรูป</td>
            <td>วันเสาร์</td>
        </tr>
        <tr>
            <td>เล่นกีตาร์</td>
            <td>วันอาทิตย์</td>
        </tr>
    </table><br>
    <table border="1">
        <caption>ทักษะของฉัน</caption>
        <thead>
            <tr>
                <th>ทักษะ</th>
                <th>ระดับ</th>
                <th>เริ่มเรียน</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>HTML</td>
                <td>พื้นฐาน</td>
                <td>บทที่ 1</td>
            </tr>
            <tr>
                <td>CSS</td>
                <td>เริ่มต้น</td>
                <td>บทที่ 2</td>
            </tr>
        </tbody>
</body>
</html>
